name: RAG Agent CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      REDIS_ENABLED: "false"
      APP_API_TOKEN: ""
      APP_ENV: "development"
      AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "ruff>=0.9,<1"
      - run: ruff check backend/ tests/